{% extends 'layout/layout.html' %}
{% load static %}
{% block content %}

<!-- 主内容区域 -->
<div class="container-fluid">
    <!-- 轮播图 -->
    <div class="carousel-container mb-5">
        <div id="mainCarousel" class="carousel slide h-100" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="3"></button>
            </div>
            <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                    <img src="{% static 'images/incadea1.webp' %}" class="d-block w-100" alt="企业办公">
                    <div class="carousel-caption">
                        <h3>Passenger Cars</h3>
                    </div>
                </div>
                <div class="carousel-item h-100">
                    <img src="{% static 'images/incadea2.webp' %}" class="d-block w-100" alt="数据分析">
                    <div class="carousel-caption">
                        <h3>Commercial Vehicles</h3>
                    </div>
                </div>
                <div class="carousel-item h-100">
                    <img src="{% static 'images/incadea3.webp' %}" class="d-block w-100" alt="数据分析">
                    <div class="carousel-caption">
                        <h3>Importer Solution</h3>
                    </div>
                </div>
                <div class="carousel-item h-100">
                    <img src="{% static 'images/incadea4.webp' %}" class="d-block w-100" alt="数据分析">
                    <div class="carousel-caption">
                        <h3>Services</h3>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <!-- 内容卡片 -->
    <div class="row g-6 mb-5">
        <div class="col-md-4">
            <div class="card card-hover h-100">
                <div class="card-body text-center">
                    <i class="fas fa-cloud fa-3x text-primary mb-3"></i>
                    <h5 class="card-title">云服务</h5>
                    <p class="card-text">安全可靠的云计算平台，弹性扩展，按需付费。</p>
                    <a href="#" class="btn btn-outline-primary">了解更多</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-hover h-100">
                <div class="card-body text-center">
                    <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                    <h5 class="card-title">安全防护</h5>
                    <p class="card-text">企业级网络安全解决方案，保护您的数据安全。</p>
                    <a href="#" class="btn btn-outline-primary">了解更多</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-hover h-100">
                <div class="card-body text-center">
                    <i class="fas fa-chart-pie fa-3x text-primary mb-3"></i>
                    <h5 class="card-title">数据分析</h5>
                    <p class="card-text">强大的数据分析工具，帮助您做出更明智的决策。</p>
                    <a href="#" class="btn btn-outline-primary">了解更多</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
