{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.5-dist/css/bootstrap.css' %}">
    <style>
      .box{
        width: 400px;
        min-height: 300px; /* 最小高度 */
        margin-top: 100px;
        margin-left: auto;
        margin-right: auto;
        border: 1px solid #dddddd;
        border-radius: 10px;  /* 四个角弧度 */
        box-shadow: 10px 10px 10px rgb(0 0 0 /5%);
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 20px;
        padding-bottom: 20px;
      }
      .box h2,
      .box h3{
        text-align: center;
      }

    </style>
</head>
<body>
  <div class="box">
    <form method="post">
      {% csrf_token %}
      <h3>用户登录</h3>
      <div class="form-group">
        <label for="username" class="form-label">用户名或邮箱</label>
        <input class="form-control" id="username" name="username">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">密码</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>
      <button type="submit" class="btn btn-primary">提交</button>
      <div>
        <span style="color: red;">{{error}}</span>
      </div>
    </form>
    </div>
</body>
</html>
