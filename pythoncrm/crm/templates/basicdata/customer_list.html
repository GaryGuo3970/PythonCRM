{% extends 'layout/layout.html' %}
{% block content %}
<h5>客户</h5>
<div>
    <a class="btn btn-primary btn-sm" href="customeradd">添加</a>
</div>
<table class="table table-bordered table-hover">
    <thead>
        <th>编号</th>
        <th>姓名</th>
        <th>地址</th>
        <th>电话</th>
        <th>邮箱</th>
        <th>年龄</th>    
        <th>操作</th>        
    </thead>
    {% for m in customers %}
    <tr>
        <td>{{ m.no }}</td>
        <td>{{ m.last_name }} {{ m.first_name }}</td>
        <td>{{ m.address }}</td>
        <td>{{ m.phone }}</td>
        <td>{{ m.email }}</td>
        <td>{{ m.age }}</td>                <td>
            <a class="btn btn-secondary btn-sm" href="customeredit?id={{ m.id}}">编辑</a>
            <a class="btn btn-danger btn-sm" href="customerdelete?id={{m.id}}">删除</a>
        </td>
    </tr>
    {% endfor %}
</div>

{% endblock %}
